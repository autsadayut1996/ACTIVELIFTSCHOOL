# Fly.io config for the ActiveLift School test server. See docs/deploy.md.
# Change `app` to a unique name before the first deploy.
app = "activelift-school"
primary_region = "sin" # Singapore: closest region to Thailand

[env]
  PORT = "8080"
  DB_PATH = "/data/activelift.db"
  BACKUP_DIR = "/data/backups"
  TRUST_PROXY = "1"
  # DEV_TIME_TRAVEL = "1"   # only for an internal demo server, never for real testers

# SQLite lives on this volume, so run exactly one machine (fly scale count 1).
[[mounts]]
  source = "activelift_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
